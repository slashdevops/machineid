name: Release

on:
  push:
    tags:
      - v[0-9].[0-9]+.[0-9]*
  workflow_dispatch:

env:
  MAKE_STOP_ON_ERRORS: true

permissions:
  id-token: write
  security-events: write
  actions: write
  contents: write
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Go version
        run: go version

      - name: Test
        run: make test

  build-linux:
    name: Build Distribution (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Go version
        run: go version

      - name: Build Linux distribution
        run: |
          GIT_VERSION=${{ github.ref_name }} GO_OS="linux" make build-dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Linux binaries with Cosign (keyless)
        run: |
          for arch in arm64 amd64; do
            for bin in machineid; do
              cosign sign-blob \
                --yes \
                --bundle "./dist/${bin}-linux-${arch}.sigstore.json" \
                "./dist/${bin}-linux-${arch}"
            done
          done

      - name: Upload Linux distribution files
        uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: ./dist/

